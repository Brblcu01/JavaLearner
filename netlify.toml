# Netlify: this file overrides the build settings in the Netlify UI.
[build]
  command = "npm run build"
  # Angular's application builder writes the static site into the browser/ subfolder
  publish = "dist/java-learner/browser"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every route (/argomenti/streams, /quiz, ...) is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and its manifest must never be cached by the browser,
# otherwise installed apps (iPhone home screen) would not pick up new versions.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
